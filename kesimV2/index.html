<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Calculator</title>
    
    <script src="js/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        t: {
                            app: 'var(--c-app)', sec: 'var(--c-sec)', head: 'var(--c-head)', lbl: 'var(--c-lbl)', 
                            ro: 'var(--c-ro)', in: 'var(--c-in)', brd: 'var(--c-brd)', txt: 'var(--c-txt)', 
                            txtinv: 'var(--c-txtinv)', green: 'var(--c-green)',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="css/fonts-googleapis-com.css" rel="stylesheet">
    
    <!-- STYLESHEET -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-ocean-arctic h-[100dvh] bg-t-app text-t-txt font-sans antialiased flex flex-col items-center justify-center p-0 md:p-4 overflow-hidden select-none transition-colors duration-300">

    <!-- MAIN APP CONTAINER -->
    <main class="w-full h-full md:h-auto md:max-h-[90dvh] max-w-[420px] bg-t-app md:border-2 border-white/10 md:rounded-2xl shadow-2xl overflow-hidden flex flex-col relative z-10 transition-colors duration-300">
        
        <div id="mainScrollArea" class="p-3 space-y-3 overflow-y-auto custom-scrollbar flex-1 relative transition-[padding] duration-300">
            
            <!-- ================= DISPLAYER BOX ================= -->
            <div class="bg-t-sec p-2 rounded-sm border-2 border-black/50 shadow-lg">
                <div id="displayModel" class="bg-t-head text-slate-500 font-bold text-lg text-center py-1 rounded-sm shadow-sm tracking-wide label-style mb-1">NO MODEL SELECTED</div>
                <div id="displayConfig" class="bg-t-head text-slate-500 font-bold text-lg text-center py-1 rounded-sm shadow-sm tracking-wide label-style">NO CONFIG SELECTED</div>
            </div>

            <!-- ================= START POINT ================= -->
            <div class="bg-t-sec p-2 rounded-sm border-2 border-black/50 shadow-lg">
                <div class="flex items-center justify-between gap-1 mb-2">
                    <div class="bg-t-lbl text-t-txt font-bold text-base text-center py-1 rounded-sm w-10 shadow-sm label-style">X</div>
                    <div class="bg-t-head text-t-txt font-bold text-lg text-center py-1 rounded-sm flex-1 shadow-sm tracking-wide label-style">START POINT</div>
                    <div class="bg-t-lbl text-t-txt font-bold text-base text-center py-1 rounded-sm w-10 shadow-sm label-style">Y</div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col border-2 border-t-brd rounded-sm overflow-hidden shadow-inner">
                        <input type="text" id="startX_ro" readonly placeholder="Readonly" class="w-full bg-t-ro text-t-txt font-mono text-sm px-2 py-2 outline-none border-b-2 border-t-brd text-center placeholder-t-txt/30">
                        <input type="text" id="startX_in" inputmode="numeric" placeholder="Input" class="numeric-input w-full bg-t-in text-t-txt font-mono text-sm px-2 py-2 outline-none text-center placeholder-t-txt/30">
                    </div>
                    <div class="flex flex-col border-2 border-t-brd rounded-sm overflow-hidden shadow-inner">
                        <input type="text" id="startY_ro" readonly placeholder="Readonly" class="w-full bg-t-ro text-t-txt font-mono text-sm px-2 py-2 outline-none border-b-2 border-t-brd text-center placeholder-t-txt/30">
                        <input type="text" id="startY_in" inputmode="numeric" placeholder="Input" class="numeric-input w-full bg-t-in text-t-txt font-mono text-sm px-2 py-2 outline-none text-center placeholder-t-txt/30">
                    </div>
                </div>
            </div>

            <!-- ================= END POINT ================= -->
            <div class="bg-t-sec p-2 rounded-sm border-2 border-black/50 shadow-lg">
                <div class="flex items-center justify-between gap-1 mb-2">
                    <div class="bg-t-lbl text-t-txt font-bold text-base text-center py-1 rounded-sm w-10 shadow-sm label-style">X</div>
                    <div class="bg-t-head text-t-txt font-bold text-lg text-center py-1 rounded-sm flex-1 shadow-sm tracking-wide label-style">END POINT</div>
                    <div class="bg-t-lbl text-t-txt font-bold text-base text-center py-1 rounded-sm w-10 shadow-sm label-style">Y</div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col border-2 border-t-brd rounded-sm overflow-hidden shadow-inner">
                        <input type="text" id="endX_ro" readonly placeholder="Readonly" class="w-full bg-t-ro text-t-txt font-mono text-sm px-2 py-2 outline-none border-b-2 border-t-brd text-center placeholder-t-txt/30">
                        <input type="text" id="endX_in" inputmode="numeric" placeholder="Input" class="numeric-input w-full bg-t-in text-t-txt font-mono text-sm px-2 py-2 outline-none text-center placeholder-t-txt/30">
                    </div>
                    <div class="flex flex-col border-2 border-t-brd rounded-sm overflow-hidden shadow-inner">
                        <input type="text" id="endY_ro" readonly placeholder="Readonly" class="w-full bg-t-ro text-t-txt font-mono text-sm px-2 py-2 outline-none border-b-2 border-t-brd text-center placeholder-t-txt/30">
                        <input type="text" id="endY_in" inputmode="numeric" placeholder="Input" class="numeric-input w-full bg-t-in text-t-txt font-mono text-sm px-2 py-2 outline-none text-center placeholder-t-txt/30">
                    </div>
                </div>
            </div>

            <!-- ================= LENGTH ================= -->
            <div class="bg-t-sec p-2 border-4 border-t-brd rounded-sm shadow-xl">
                <div class="flex items-stretch mb-1 gap-1">
                    <div class="bg-t-head text-t-txt font-bold text-base flex items-center justify-center w-28 rounded-sm py-1 shadow-sm label-style">LENGTH</div>
                    <input type="text" id="len_ro" readonly placeholder="Readonly" class="flex-1 bg-t-ro text-t-txt font-mono text-sm px-2 py-1 outline-none border-2 border-t-brd text-center rounded-sm placeholder-t-txt/30">
                </div>
                <div class="flex items-stretch mb-1 gap-1">
                    <div class="bg-t-green text-t-txt font-bold text-base flex items-center justify-center w-28 rounded-sm py-1 shadow-sm label-style">START</div>
                    <input type="text" id="len_start_in" inputmode="numeric" placeholder="Input" class="numeric-input flex-1 bg-t-in text-t-txt font-mono text-sm px-2 py-1 outline-none border-2 border-t-brd text-center rounded-sm placeholder-t-txt/30">
                </div>
                <div class="flex items-stretch gap-1">
                    <div class="bg-t-green text-t-txt font-bold text-base flex items-center justify-center w-28 rounded-sm py-1 shadow-sm label-style">END</div>
                    <input type="text" id="len_end_in" inputmode="numeric" placeholder="Input" class="numeric-input flex-1 bg-t-in text-t-txt font-mono text-sm px-2 py-1 outline-none border-2 border-t-brd text-center rounded-sm placeholder-t-txt/30">
                </div>
            </div>

            <!-- ================= DEGREE ================= -->
            <div class="bg-t-sec p-2 rounded-sm border-2 border-black/50 shadow-lg">
                <div class="bg-t-head flex items-center justify-between text-t-txt font-bold text-lg py-1 px-3 mb-2 rounded-sm shadow-sm label-style">
                    <div class="dial-icon">
                        <div id="dialPointer1" class="dial-pointer" style="transform: translateX(-50%) rotate(-45deg);"></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="tracking-widest">DEGREE</span>
                        <select id="degreeModeSelect" onchange="onDegreeModeChange()" class="bg-[#1e293b] text-[#38bdf8] text-xs font-bold px-1.5 py-0.5 rounded border border-[#38bdf8]/40 outline-none cursor-pointer">
                            <option value="12">1 & 2</option>
                            <option value="34">3 & 4</option>
                        </select>
                    </div>
                    <div class="dial-icon">
                        <div id="dialPointer2" class="dial-pointer" style="transform: translateX(-50%) rotate(45deg);"></div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2" id="degreeBoxContainer">
                    <input type="text" id="deg_1" readonly placeholder="Readonly" class="w-full bg-t-ro text-t-txt font-mono text-sm px-2 py-2 outline-none border-2 border-t-brd text-center rounded-sm placeholder-t-txt/30">
                    <input type="text" id="deg_2" readonly placeholder="Readonly" class="w-full bg-t-ro text-t-txt font-mono text-sm px-2 py-2 outline-none border-2 border-t-brd text-center rounded-sm placeholder-t-txt/30">
                    <input type="text" id="deg_3" readonly placeholder="Readonly" class="hidden w-full bg-t-ro text-t-txt font-mono text-sm px-2 py-2 outline-none border-2 border-t-brd text-center rounded-sm placeholder-t-txt/30">
                    <input type="text" id="deg_4" readonly placeholder="Readonly" class="hidden w-full bg-t-ro text-t-txt font-mono text-sm px-2 py-2 outline-none border-2 border-t-brd text-center rounded-sm placeholder-t-txt/30">
                </div>
            </div>

        </div>

        <!-- ================= DATA BACKUP / PORTABILITY MODAL ================= -->
        <div id="backupModal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-xs z-50 flex items-center justify-center p-4">
            <div class="w-full bg-t-sec border-2 border-t-brd rounded-sm p-3 shadow-2xl flex flex-col gap-3">
                <div class="flex items-center justify-between bg-t-head px-3 py-1.5 rounded-sm border border-black/40">
                    <span class="font-bold text-sm tracking-widest label-style">DATA TRANSFER & BACKUP</span>
                    <button onclick="toggleBackupModal()" class="text-slate-300 hover:text-white">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <p class="text-xs text-slate-300 leading-relaxed">
                    Export all saved models, coordinates, degrees, and degree configurations.
                </p>

                <!-- Export Buttons -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportDataFile()" class="bg-[#0f766e] hover:bg-[#115e59] text-white font-bold py-2 px-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-xs tracking-wider border border-black/30 flex items-center justify-center gap-1.5 label-style">
                        <i class="bi bi-download"></i> EXPORT FILE
                    </button>
                    <button id="copyJsonBtn" onclick="copyDataToClipboard()" class="bg-[#475569] hover:bg-[#64748b] text-white font-bold py-2 px-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-xs tracking-wider border border-black/30 flex items-center justify-center gap-1.5 label-style">
                        <i class="bi bi-clipboard"></i> COPY DATA
                    </button>
                </div>

                <div class="border-t border-white/10 pt-2 flex flex-col gap-2">
                    <label class="text-xs font-bold text-[#38bdf8] tracking-wider">IMPORT / RESTORE DATA:</label>
                    <input type="file" id="importFileInput" accept=".json,application/json" onchange="importDataFile(event)" class="hidden">
                    <button onclick="document.getElementById('importFileInput').click()" class="w-full bg-[#334155] hover:bg-[#475569] border border-dashed border-[#38bdf8] text-[#38bdf8] font-bold py-2 px-3 rounded-sm text-xs tracking-wider transition-colors flex items-center justify-center gap-1.5">
                        <i class="bi bi-upload"></i> LOAD BACKUP FILE (.JSON)
                    </button>

                    <textarea id="importJsonText" rows="3" placeholder="Or paste backup text here..." class="w-full bg-t-in border border-t-brd/60 rounded-sm p-2 text-xs font-mono text-t-txt outline-none focus:border-t-brd select-text"></textarea>
                    <button onclick="importDataFromText()" class="w-full bg-[#475569] hover:bg-[#64748b] text-white font-bold py-2 px-3 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-xs tracking-wider border border-black/30 label-style">
                        RESTORE FROM TEXT
                    </button>
                </div>

                <div id="backupStatus" class="hidden text-xs text-center font-bold py-1 rounded-sm"></div>
            </div>
        </div>

        <!-- ================= FOOTER ================= -->
        <div class="bg-t-head flex flex-col flex-shrink-0 border-t-4 border-black/30 transition-all duration-300 relative z-40">
            
            <!-- Floating Dropdown Menu -->
            <div id="dropdownMenu" class="hidden absolute bottom-full left-0 w-full p-2 border border-black/30 bg-[#334155] flex-col z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.6)]">
                
                <div id="listContainer" class="hidden w-full mb-2 max-h-56 overflow-y-auto list-scrollbar bg-[#1e293b] border border-black/30 rounded-sm p-2 flex-col gap-2">
                    <div id="list-models" class="list-content hidden flex-col w-full"></div>
                    <div id="list-front" class="list-content hidden flex-col w-full"></div>
                    <div id="list-back" class="list-content hidden flex-col w-full"></div>

                    <!-- DEGREE CALIBRATION PANEL -->
                    <div id="panel-calibrate" class="list-content hidden flex-col w-full gap-2">
                        <div class="grid grid-cols-2 gap-2 items-stretch">
                            <div class="bg-[#0f766e] text-white font-bold text-sm flex items-center justify-center py-1.5 px-2 rounded-sm border border-black/40 shadow-sm tracking-wider label-style">
                                DEGREE +
                            </div>
                            <div id="calibCurrentDisplay" class="bg-t-ro text-[#38bdf8] font-mono font-bold text-base flex items-center justify-center py-1.5 px-2 rounded-sm border-2 border-t-brd shadow-inner">
                                90°
                            </div>
                        </div>

                        <div class="bg-t-sec p-2 rounded-sm border border-black/40 grid grid-cols-2 gap-2">
                            <button onclick="setDegreeCalib(0)" data-calib="0" class="calib-preset-btn bg-[#475569] hover:bg-[#64748b] text-white font-mono font-bold text-xs py-2 px-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all border border-black/30 label-style">0°</button>
                            <button onclick="setDegreeCalib(90)" data-calib="90" class="calib-preset-btn bg-[#475569] hover:bg-[#64748b] text-white font-mono font-bold text-xs py-2 px-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all border border-black/30 label-style">90°/-270°</button>
                            <button onclick="setDegreeCalib(180)" data-calib="180" class="calib-preset-btn bg-[#475569] hover:bg-[#64748b] text-white font-mono font-bold text-xs py-2 px-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all border border-black/30 label-style">180°/-180°</button>
                            <button onclick="setDegreeCalib(270)" data-calib="270" class="calib-preset-btn bg-[#475569] hover:bg-[#64748b] text-white font-mono font-bold text-xs py-2 px-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all border border-black/30 label-style">270°/-90°</button>
                        </div>

                        <div class="bg-t-sec p-2 rounded-sm border border-black/40 grid grid-cols-2 gap-2 items-stretch">
                            <input type="text" id="customCalibInput" inputmode="numeric" placeholder="Custom °" class="numeric-input w-full bg-t-in text-t-txt font-mono text-sm px-2 py-1.5 outline-none border-2 border-t-brd text-center rounded-sm placeholder-t-txt/30">
                            <button onclick="applyCustomCalib()" class="bg-[#475569] hover:bg-[#64748b] text-white font-bold text-xs py-1.5 px-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all tracking-wider border border-black/30 label-style">CUSTOM SET</button>
                        </div>
                    </div>
                </div>

                <div class="flex items-center w-full gap-2 overflow-x-auto pb-1 custom-scrollbar">
                    <button onclick="toggleVerticalList('list-models', this)" class="tab-btn flex-shrink-0 px-3 bg-[#475569] hover:bg-[#64748b] text-white font-bold py-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-sm tracking-widest border border-black/30 label-style">MODELS</button>
                    <button onclick="toggleVerticalList('list-front', this)" class="tab-btn flex-shrink-0 px-3 bg-[#475569] hover:bg-[#64748b] text-white font-bold py-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-sm tracking-widest border border-black/30 label-style">FRONT</button>
                    <button onclick="toggleVerticalList('list-back', this)" class="tab-btn flex-shrink-0 px-3 bg-[#475569] hover:bg-[#64748b] text-white font-bold py-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-sm tracking-widest border border-black/30 label-style">BACK</button>
                    <button onclick="openModelViewer()" class="tab-btn flex-shrink-0 px-3 bg-[#475569] hover:bg-[#64748b] text-white font-bold py-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-sm tracking-widest border border-black/30 label-style">VIEW</button>
                    <button onclick="toggleVerticalList('panel-calibrate', this)" class="tab-btn flex-shrink-0 px-3 bg-[#475569] hover:bg-[#64748b] text-white font-bold py-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-sm tracking-widest border border-black/30 label-style">CALIBRATE</button>
                    <!-- UPDATE BUTTON (Last button in menu) -->
                    <button id="menuUpdateBtn" onclick="checkAndUpdateApp()" class="tab-btn flex-shrink-0 px-3 bg-[#0f766e] hover:bg-[#115e59] text-white font-bold py-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-sm tracking-widest border border-black/30 label-style">UPDATE</button>
                </div>
            </div>

            <!-- Main Buttons Row -->
            <div class="p-3 flex items-center justify-between gap-2">
                <button onclick="toggleMenu()" class="flex items-center gap-1 px-3 bg-[#475569] hover:bg-[#64748b] text-white font-bold py-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-sm tracking-widest border border-black/30 label-style">
                    <i class="bi bi-chevron-up transition-transform duration-300" id="menuIcon"></i> MENU
                </button>

                <button onclick="calculateAction()" class="flex-shrink-0 flex items-center gap-1.5 px-3 bg-[#475569] hover:bg-[#64748b] text-white font-bold py-2 rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all text-sm tracking-widest border border-black/30 label-style">
                    CALCULATE
                </button>

                <div class="flex items-center gap-3 flex-shrink-0">
                    <button onclick="toggleBackupModal()" class="w-10 h-10 flex items-center justify-center bg-[#475569] hover:bg-[#64748b] text-white rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all border border-black/30" title="Export / Import Data">
                        <i class="bi bi-gear-fill text-xl drop-shadow-md"></i>
                    </button>
                    <button id="saveBtn" onclick="saveAction(true)" class="w-10 h-10 flex items-center justify-center bg-[#475569] hover:bg-[#64748b] text-white rounded-sm shadow-[2px_2px_0px_#000] active:translate-y-[2px] active:shadow-none transition-all border border-black/30" title="Save Coordinates & Degrees">
                        <i class="bi bi-floppy text-xl drop-shadow-md"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- ================= FULL-SCREEN MODEL LINES VIEWER ================= -->
    <div id="viewerModal" class="hidden fixed inset-0 w-screen h-[100dvh] bg-slate-950 z-[100] flex flex-col overflow-hidden">
        <div class="absolute top-3 left-3 z-10 pointer-events-none">
          <div class="flex items-center bg-slate-900/95 backdrop-blur border border-slate-800 rounded-xl p-1 shadow-lg space-x-1 pointer-events-auto">
            <button onclick="viewerZoom(1.25)" title="Zoom In (+)" class="p-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path></svg>
            </button>
            <span id="viewerZoomBadge" class="px-2 text-xs font-mono text-slate-300 min-w-[3.25rem] text-center" title="Current Zoom Level">100%</span>
            <button onclick="viewerZoom(0.8)" title="Zoom Out (-)" class="p-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg>
            </button>
            <div class="h-4 w-px bg-slate-800 mx-0.5"></div>
            <button onclick="viewerFitAll()" title="Fit All Lines / Max View (F)" class="px-2.5 py-1.5 text-emerald-400 hover:text-white hover:bg-emerald-600/20 border border-emerald-500/30 rounded-lg flex items-center space-x-1 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
              <span class="text-xs font-medium hidden sm:inline">Max View</span>
            </button>
            <button onclick="viewerReset()" title="Reset Zoom &amp; Center (0,0)" class="p-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>
          </div>
        </div>

        <div class="absolute bottom-3 right-3 z-10 flex items-center space-x-2 pointer-events-none">
          <div class="bg-slate-900/95 backdrop-blur border border-slate-800 text-slate-200 px-3 py-1.5 rounded-xl shadow-lg font-mono text-xs flex items-center space-x-2 pointer-events-auto">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span>X: <span id="vCoordX" class="text-white font-bold">0.00</span></span>
            <span class="text-slate-600">|</span>
            <span>Y: <span id="vCoordY" class="text-white font-bold">0.00</span></span>
          </div>
          <button onclick="closeModelViewer()" class="bg-slate-900/95 hover:bg-red-600/80 text-slate-300 hover:text-white border border-slate-800 px-3 py-1.5 rounded-xl shadow-lg transition-colors pointer-events-auto flex items-center space-x-1.5 text-xs font-bold" title="Exit Full-Screen Viewer (Esc)">
            <i class="bi bi-x-lg text-sm"></i>
            <span class="hidden sm:inline">CLOSE</span>
          </button>
        </div>

        <div class="absolute bottom-3 left-3 z-10 pointer-events-none bg-slate-900/95 backdrop-blur border border-slate-800 px-3 py-1.5 rounded-xl shadow-lg font-bold text-xs text-slate-300">
          Model: <span id="viewerModelTitle" class="text-[#38bdf8]"></span>
        </div>

        <canvas id="modelViewerCanvas" class="w-screen h-[100dvh] block cursor-grab"></canvas>
    </div>

    <!-- SCRIPTS -->
    <script src="js/state.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/viewer.js"></script>

    <!-- OFFLINE SERVICE WORKER & VERSION CHECK LOGIC -->
    <script>
      const APP_VERSION_KEY = 'coord_calc_installed_version';
      const CACHE_NAME = 'coord-calculator-v1';
      const APP_ASSETS = [
        '',
        'index.html',
        'css/styles.css',
        'js/state.js',
        'js/calculator.js',
        'js/ui.js',
        'js/viewer.js',
        'js/tailwindcss.js',
        'css/bootstrap-icons.css',
        'css/fonts-googleapis-com.css'
      ];

      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
      }

      // Version comparison utility
      function isNewerVersion(serverVer, localVer) {
        if (!localVer) return true;
        const sParts = String(serverVer).split('.').map(Number);
        const lParts = String(localVer).split('.').map(Number);
        const len = Math.max(sParts.length, lParts.length);

        for (let i = 0; i < len; i++) {
          const s = sParts[i] || 0;
          const l = lParts[i] || 0;
          if (s > l) return true;
          if (s < l) return false;
        }
        return false;
      }

      // Update button triggered action
      async function checkAndUpdateApp() {
        const btn = document.getElementById('menuUpdateBtn');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'CHECKING...';

        try {
          // Fetch version.json from server bypassing browser cache
          const versionRes = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
          if (!versionRes.ok) throw new Error('Version file not found');
          
          const versionData = await versionRes.json();
          const serverVersion = versionData.version;
          const localVersion = localStorage.getItem(APP_VERSION_KEY);

          // Check if server has a newer version
          if (!isNewerVersion(serverVersion, localVersion)) {
            alert(`App is already up to date (v${localVersion || serverVersion}).`);
            btn.disabled = false;
            btn.textContent = originalText;
            return;
          }

          // Download fresh app assets
          btn.textContent = `UPDATING v${serverVersion}...`;
          const freshResponses = await Promise.all(
            APP_ASSETS.map(url => fetch(url, { cache: 'reload' }))
          );

          // Replace cache contents
          await caches.delete(CACHE_NAME);
          const cache = await caches.open(CACHE_NAME);
          for (let i = 0; i < APP_ASSETS.length; i++) {
            await cache.put(APP_ASSETS[i], freshResponses[i]);
          }

          // Save new version and reload
          localStorage.setItem(APP_VERSION_KEY, serverVersion);
          alert(`Successfully updated to v${serverVersion}! Reloading app...`);
          window.location.reload();

        } catch (err) {
          alert('Could not check for updates. Make sure you have an active internet connection.');
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }
    </script>
</body>
</html>
